apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// Optimize DEX and resources while preserving JNI/React Native entry points.
// App-specific bridge rules live in proguard-rules.pro; libraries also supply consumer rules.
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Keep private signing material out of source control and command-line arguments.
def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('signing.local.properties')
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}
def uploadSetting = { String propertyName, String environmentName ->
    providers.environmentVariable(environmentName).orNull ?: uploadProperties.getProperty(propertyName)
}
def uploadStorePath = uploadSetting('storeFile', 'BFCAM_UPLOAD_STORE_FILE')
def uploadStorePassword = uploadSetting('storePassword', 'BFCAM_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = uploadSetting('keyAlias', 'BFCAM_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = uploadSetting('keyPassword', 'BFCAM_UPLOAD_KEY_PASSWORD')
def uploadStoreType = uploadSetting('storeType', 'BFCAM_UPLOAD_STORE_TYPE') ?: 'PKCS12'

tasks.register('validateUploadSigning') {
    group = 'verification'
    description = 'Require a private upload key for release builds; never fall back to the debug key.'
    doLast {
        if (![uploadStorePath, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it?.trim() }) {
            throw new GradleException('Release signing is not configured. See ANDROID_RELEASE.md; configure android/signing.local.properties or BFCAM_UPLOAD_* environment variables.')
        }
        if (!rootProject.file(uploadStorePath).isFile()) {
            throw new GradleException('Release upload keystore file does not exist. Check the private signing configuration.')
        }
        if (uploadKeyAlias == 'androiddebugkey' || rootProject.file(uploadStorePath).canonicalFile == file('debug.keystore').canonicalFile) {
            throw new GradleException('Release builds cannot use the Android debug key.')
        }
        try {
            def uploadKeyStore = java.security.KeyStore.getInstance(uploadStoreType)
            rootProject.file(uploadStorePath).withInputStream { uploadKeyStore.load(it, uploadStorePassword.toCharArray()) }
            def certificate = uploadKeyStore.getCertificate(uploadKeyAlias)
            if (!uploadKeyStore.isKeyEntry(uploadKeyAlias) || !uploadKeyStore.getKey(uploadKeyAlias, uploadKeyPassword.toCharArray()) || !certificate) {
                throw new IllegalStateException('Missing private key entry')
            }
            certificate.checkValidity()
            if (certificate.subjectX500Principal.name.contains('CN=Android Debug')) {
                throw new IllegalStateException('Debug certificate')
            }
        } catch (Exception ignored) {
            throw new GradleException('The upload key is invalid, expired, uses a debug certificate, or cannot be opened. Check the private signing configuration.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn('validateUploadSigning')
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bfcam"
    defaultConfig {
        applicationId "com.bfcam"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.7"
    }
    signingConfigs {
        release {
            if (uploadStorePath) storeFile rootProject.file(uploadStorePath)
            if (uploadStorePassword) storePassword uploadStorePassword
            if (uploadKeyAlias) keyAlias uploadKeyAlias
            if (uploadKeyPassword) keyPassword uploadKeyPassword
            storeType uploadStoreType
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.google.mlkit:pose-detection:18.0.0-beta5")
    implementation("com.google.mlkit:image-labeling:17.0.9")
    implementation("com.google.mlkit:object-detection:17.0.2")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
